
services:
  # 1. Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - display_network

  # 2. Backend (Node.js API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3027:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - APP_URL=${APP_URL:-http://localhost:3025}
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
    networks:
      - display_network
    # Cria/atualiza tabelas no banco + cria admin + inicia o servidor (com delay de 5s para o Postgres subir)
    command: >
      sh -c "sleep 5 && npx prisma db push --skip-generate && node prisma/seed-prod.js && npm start"

  # 3. Frontend (React + Vite servido pelo Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Usamos rota relativa /api para que o NGINX faça o proxy reverso
        - VITE_API_URL=/api
    restart: unless-stopped
    ports:
      - "3025:3025"
    networks:
      - display_network

  # 4. pgAdmin — Interface visual para o banco de dados
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5053:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - display_network

networks:
  display_network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  uploads_data:
