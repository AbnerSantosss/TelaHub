name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: telahub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/telahub_ci?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma db push --skip-generate
      # Catálogo de planos. Vários testes (quota, subscription) consultam os
      # planos REAIS por código — `suggestUpgradeFor` procura o `loja` para
      # sugerir o upgrade, por exemplo. Sem semear, o banco do CI só tem os
      # planos que cada teste cria para si, e a sugestão cai num fallback:
      # é a diferença entre o CI e a máquina do dev, onde o catálogo já existe.
      - run: npx tsx prisma/seed-plans.ts
      # `build` compila só o código de produção (tsconfig.build.json), então o
      # type-check dos testes precisa de um passo próprio.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
