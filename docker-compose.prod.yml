# Stack NOVA do painel — instalação limpa, em paralelo à antiga.
#
# Arquivo separado do `docker-compose.yml` de propósito: aquele é o que a stack
# `telahub-novo` (a que está no ar hoje) puxa do Git. Mexer nele mudaria o
# deploy antigo junto — e o ponto deste aqui é justamente ser independente.
#
# ─── O que muda em relação ao antigo ──────────────────────────────────────────
# 1. PORTAS PRÓPRIAS, diferentes das da stack antiga. O túnel desta VPS roda no
#    HOST e roteia para `localhost:PORTA` — ele não enxerga nomes de container,
#    então publicar porta é obrigatório. Usar as mesmas 3025/3027 da stack
#    antiga faria o container novo nem subir ("port is already allocated"),
#    por isso a faixa 40xx.
#      4025 → gateway  (rota: devtelahub.proxserverabner.site). Domínio único
#                       desde 15/10/2026: site em /, painel em /app/, checkout
#                       em /checkout/, api em /api/ e /uploads/. Ver
#                       `apps/gateway/nginx.conf`. Os nomes antigos
#                       (devtelahubpainel, devtelahubcheckout,
#                       devtelahublandingpage) respondem com 301 para o
#                       domínio único quando apontados para esta porta, e
#                       continuam servindo /api sem redirect (webhook).
#    O backend NÃO publica porta: o Nginx do gateway faz proxy de /api.
#    Consequência prática, e é a que decide o roteamento no Cloudflare: TODA
#    chamada pública à API (inclusive `/api/health` e o webhook do Asaas)
#    atravessa a porta 4025. Não existe rota que chegue ao backend por fora
#    dele — ver o procedimento numerado em DEPLOY.md.
#
#    As stacks próprias do site e do checkout continuam existindo só para a
#    transição. Com os nomes antigos apontados para a 4025, elas podem parar:
#      4038 → site      (stack 118)  apps/site/docker-compose.prod.yml
#      4039 → checkout  (stack 119)  apps/checkout/docker-compose.prod.yml
#    Convenção de 25/09/2026: `telahub.proxserverabner.site` é o TelaHub
#    principal (stack antiga `telahub-novo`). Esta versão usa só nomes com
#    prefixo `devtelahub`. Os nomes `painel.`, `vendas.` e `checkout.` saíram
#    do ar. O domínio precisa ser o mesmo em todos os arquivos: divergência
#    vira link morto no bundle, que é lido em tempo de BUILD e não se corrige
#    mexendo no Portainer.
#    As stacks não foram renomeadas. Renomear recria os volumes com outro
#    prefixo e o banco nasceria vazio.
# 2. Banco NOVO E VAZIO. O volume é próprio desta stack, então nada da base
#    antiga vem junto — é uma instalação limpa. A base antiga continua intacta
#    no volume dela, servindo a stack antiga.
# 3. Sem pgAdmin. O antigo estava publicado na 5053, um administrador de banco
#    aberto na internet. Para operar o banco: `docker exec -it <db> psql`.
#
# ─── Variáveis obrigatórias (Portainer) ───────────────────────────────────────
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   JWT_SECRET        openssl rand -base64 48   (mín. 32 caracteres)
#   ADMIN_EMAIL, ADMIN_PASSWORD                 (mín. 12 caracteres)
# Como o banco nasce vazio, não existe admin: sem ADMIN_* o seed aborta e o
# container não sobe. É proposital — ver `backend/prisma/seed-prod.js`.
#
# ─── Variáveis para COBRAR e MEDIR (novas em 2026-09-05) ─────────────────────
#   PAYMENT_PROVIDER=asaas   ASAAS_ENV   ASAAS_API_KEY   ASAAS_WEBHOOK_TOKEN
#   ASAAS_NFSE_ENABLED
#   GTM_CONTAINER_ID   META_PIXEL_ID   META_CAPI_ACCESS_TOKEN
#   META_CAPI_TEST_EVENT_CODE (vazio em produção)
#   COMPANY_CNPJ   PRIVACY_CONTACT_EMAIL   SITE_PUBLIC_URL
#
# ARMADILHA QUE JÁ CUSTOU UM DEPLOY: variável cadastrada na stack do Portainer
# NÃO chega ao container se o compose não a repassar na lista `environment`. Foi
# assim que ADMIN_* e SMTP_* ficaram sem efeito. Se você adicionar uma variável
# nova ao código, adicione a linha aqui NO MESMO commit.
#
# Os segredos (ASAAS_API_KEY, ASAAS_WEBHOOK_TOKEN, META_CAPI_ACCESS_TOKEN) estão
# escritos como `${VAR}` SEM valor padrão, de propósito: valor padrão em segredo
# é segredo no Git. O repositório, aliás, ainda é público — ver DEPLOY.md.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      # `:?` faz o deploy PARAR com a causa escrita quando a variável falta.
      # Sem isso `${VAR}` vira texto vazio, o backend recebe
      # `postgresql://:senha@db:5432/` e o Prisma responde P1010 ("acesso
      # negado"), que aponta para permissão quando o que falta é o nome. Foi
      # o que deixou a stack antiga fora do ar de 29/07 em diante.
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER na stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD na stack}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB na stack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - telahub_net
    healthcheck:
      # Substitui o `sleep 5` do compose antigo, que era um chute: o backend
      # espera o banco aceitar conexão de verdade.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      # Origens EXATAS: a comparação é por igualdade, então barra final a mais
      # ou domínio parcial derruba a comunicação do painel com a API.
      # O SITE entra na lista desde que a LP passou a chamar `POST /api/leads`:
      # sem a origem exata aqui, o formulário "Falar com a gente" é bloqueado
      # pelo navegador e todo lead de plano sob consulta se perde em silêncio.
      # Desde o domínio único (15/10/2026) os três apps chamam a api na MESMA
      # origem, então o navegador nem manda CORS para devtelahub. Ele entra na
      # lista assim mesmo (o Origin vai em POST). Os três nomes antigos ficam
      # enquanto houver bundle antigo em cache ou TV pareada neles.
      - CORS_ORIGINS=${CORS_ORIGINS:-https://devtelahub.proxserverabner.site,https://devtelahubpainel.proxserverabner.site,https://devtelahubcheckout.proxserverabner.site,https://devtelahublandingpage.proxserverabner.site}
      # Endereço do painel nos e-mails: login (`/#/login`), redefinição de
      # senha (`/#/reset-password`) e boas-vindas. SEM barra final.
      - APP_URL=${APP_URL:-https://devtelahub.proxserverabner.site/app}
      # Endereço público da api, usado no link de descadastro dos e-mails
      # (`email.service.ts`). Sem esta linha o padrão vira `${APP_URL}/api`,
      # que agora é /app/api e cai no painel em vez da api.
      - API_PUBLIC_URL=${API_PUBLIC_URL:-https://devtelahub.proxserverabner.site/api}
      # Destino do botão de assinar, lido em `billing.routes.ts`. Sem esta
      # linha a variável cadastrada no Portainer nunca chega ao container.
      # Tem de terminar em /checkout/c: a api monta `${CHECKOUT_URL}?plano=...`,
      # e /checkout?... perde a query no redirect para /checkout/c.
      - CHECKOUT_URL=${CHECKOUT_URL:-https://devtelahub.proxserverabner.site/checkout/c}
      # Saltos até o backend: Cloudflare Tunnel → Nginx → backend = 2.
      # Com 1, o rate limit de login agrupa todos os visitantes num contador só.
      - TRUST_PROXY=${TRUST_PROXY:-2}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador}
      - ADMIN_PASSWORD_RESET=${ADMIN_PASSWORD_RESET:-false}
      # E-mail transacional. É só o PADRÃO da instalação: o que o `master`
      # salvar em Configurações de E-mail fica no banco e tem precedência.
      # Host/porta saem do catálogo do provedor; SMTP_HOST/PORT/SECURE só são
      # necessários com provider `custom` ou região alternativa.
      - SMTP_PROVIDER=${SMTP_PROVIDER:-gmail}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-TelaHub}
      # Armazenamento de mídia (Cloudflare R2). Obrigatório em produção: o
      # backend aborta o boot sem essas cinco variáveis (ver server.ts).
      # Mesma armadilha do comentário acima — sem a linha aqui, cadastrar no
      # Portainer não tem efeito nenhum.
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # Pagamento. Declarados aqui porque variável NÃO declarada no compose não
      # chega ao container por mais que se cadastre no Portainer — mesma
      # armadilha que já deixou ADMIN_*/SMTP_* sem efeito nesta stack.
      #
      # Sem `ALLOW_SIMULATED_PAYMENTS=true`, o provedor simulado é RECUSADO em
      # produção: as rotas de cobrança respondem 503 e o checkout cai no contato
      # comercial. O backend NÃO morre — ele também serve o Player, e derrubá-lo
      # por erro de pagamento apagaria as TVs dos clientes.
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-simulado}
      - ALLOW_SIMULATED_PAYMENTS=${ALLOW_SIMULATED_PAYMENTS:-}
      #
      # ── Gateway Asaas ────────────────────────────────────────────────────
      # `sandbox` é o padrão de propósito: esquecer a variável e cobrar de
      # verdade sem querer é pior do que esquecer e não cobrar. Ao virar a
      # chave para `production`, confira que a ASAAS_API_KEY é a de produção —
      # chave de sandbox em ambiente production devolve 401 em toda cobrança.
      - ASAAS_ENV=${ASAAS_ENV:-sandbox}
      # SEGREDOS: sem valor padrão, nunca chumbados aqui. Cadastre no Portainer.
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      # Prova que o webhook veio do gateway. Sem ele, qualquer um confirma o
      # próprio pagamento com um `curl` na URL pública.
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      # `false` = nota fiscal emitida à mão no primeiro mês.
      - ASAAS_NFSE_ENABLED=${ASAAS_NFSE_ENABLED:-false}
      #
      # ── Medição (Google/Meta) ────────────────────────────────────────────
      # O Pixel é público (vai no HTML). O TOKEN da Conversions API não: ele
      # autoriza enviar evento em nome da conta de anúncios e NUNCA pode ir
      # para o frontend nem para o Git — por isso fica aqui, sem padrão.
      - GTM_CONTAINER_ID=${GTM_CONTAINER_ID:-}
      - META_PIXEL_ID=${META_PIXEL_ID:-}
      - META_CAPI_ACCESS_TOKEN=${META_CAPI_ACCESS_TOKEN}
      # VAZIO em produção. Preenchido, todo evento entra como "teste" no
      # Gerenciador de Eventos e não otimiza campanha nenhuma.
      - META_CAPI_TEST_EVENT_CODE=${META_CAPI_TEST_EVENT_CODE:-}
      #
      # ── Identificação do fornecedor e canal do titular (CDC/LGPD) ────────
      # Aparecem no rodapé, nos Termos, na Privacidade e na nota fiscal.
      - COMPANY_CNPJ=${COMPANY_CNPJ:-}
      - PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL:-}
      # Fonte única do canonical/OG/JSON-LD. NUNCA telahub.com.br: aquele
      # domínio é de terceiro desde 2025.
      - SITE_PUBLIC_URL=${SITE_PUBLIC_URL:-https://devtelahub.proxserverabner.site}
      # Botões "Entrar como plano X" na tela de login, SEM senha (decisão do
      # dono em 15/10/2026: este painel de teste é público de propósito).
      # `true` faz o boot criar as contas demo com senha aleatória e liga a rota
      # POST /api/auth/demo-login. Não é segredo, por isso tem padrão. Para
      # desligar, cadastre DEMO_LOGIN=false na stack. Ver `src/lib/demo-login.ts`.
      # DEMO_USER_PASSWORD NÃO é repassada de propósito: nenhuma senha conhecida.
      - DEMO_LOGIN=${DEMO_LOGIN:-true}
    depends_on:
      db:
        condition: service_healthy
    # Prova de vida do backend. Sem healthcheck, um container que subiu mas
    # morreu no boot (migração falhando, JWT_SECRET curto) fica "running" e o
    # sintoma que chega ao dono é 502 no navegador — foi exatamente o que
    # aconteceu com a API em 05/09.
    #
    # `start_period` alto de propósito: antes do `npm start` o boot roda
    # migração + três seeds. Com o padrão (0s) o container seria marcado
    # unhealthy no meio da migração e reiniciado em laço, refazendo a migração
    # do zero a cada volta.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/api/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - uploads_data:/app/uploads
    networks:
      # `default`: onde o gateway o encontra.
      # `telahub_net`: onde o banco está e onde o checkout da stack 119 ainda
      # o procura. Sai daqui quando a 119 for removida.
      - default
      - telahub_net
    # Sequência de boot. A ORDEM IMPORTA:
    #   1. migrate-deploy  — aplica as MIGRAÇÕES versionadas (com baseline
    #                        automático em banco que veio da era do `db push`).
    #                        Trocado de `db push` em 2026-08-29: `db push`
    #                        resolve divergência apagando dado.
    #   2. backfill-tenant — vincula registros pré-existentes a uma organização.
    #                        Num banco novo não faz nada; é idempotente e fica
    #                        aqui para o dia em que esta stack não for mais nova.
    #   3. seed-plans      — catálogo de planos (o seed-prod depende do `loja`)
    #   4. seed-prod       — admin, display demo e assinatura
    #   5. seed-demo-users — SÓ com DEMO_LOGIN=true: uma conta por plano, com
    #                        senha aleatória nova a cada boot. `$$` porque o
    #                        compose interpola `$` antes do shell ver a linha.
    # Encadeado com `&&`: se o seed falhar por falta de ADMIN_PASSWORD, o
    # container NÃO sobe. É melhor do que subir sem admin.
    command: >
      sh -c "node prisma/migrate-deploy.js &&
      npx tsx prisma/backfill-tenant-scope.ts &&
      npx tsx prisma/seed-plans.ts &&
      node prisma/seed-prod.js &&
      { [ \"$$DEMO_LOGIN\" != true ] || npx tsx prisma/seed-demo-users.ts; } &&
      npm start"

  # Gateway do domínio único: serve site, painel e checkout e faz o proxy de
  # /api e /uploads para o backend. Substitui o antigo serviço `frontend`
  # (só o painel) e, quando o dono repontar os nomes antigos, as stacks
  # 118 (site) e 119 (checkout). Ver apps/gateway/nginx.conf.
  gateway:
    ports:
      # devtelahub.proxserverabner.site -> localhost:4025 (rota no túnel do host).
      # Mesma porta do antigo `frontend`: a rota de devtelahubpainel já aponta
      # para cá, e o gateway responde nela com 301 para o domínio novo.
      - "4025:80"
    build:
      # Contexto na RAIZ: os apps importam arquivos de packages/.
      context: .
      dockerfile: apps/gateway/Dockerfile
      args:
        # Lidos em tempo de BUILD e embutidos no bundle. Relativos de propósito:
        # todos os apps estão no mesmo domínio, então o mesmo build serve
        # qualquer hostname apontado para esta porta. Uma variável da stack com
        # o mesmo nome passa por cima do default, mas só depois de rebuild.
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APP_URL=${VITE_APP_URL:-/app}
        - VITE_SITE_URL=${VITE_SITE_URL:-/}
        - VITE_CHECKOUT_URL=${VITE_CHECKOUT_URL:-/checkout}
        # Preços do build do site (scripts/fetch-plans.mjs). Se a API não
        # responder, o build segue com o snapshot de src/data/planos.json.
        - PLANS_API_URL=${PLANS_API_URL:-https://devtelahub.proxserverabner.site/api}
        - VITE_CONTACT_EMAIL=${CONTACT_EMAIL:-}
    restart: unless-stopped
    # O nginx tem `proxy_pass http://backend:3001` e resolve o upstream ao
    # CARREGAR a configuração: se o container `backend` ainda não existir, ele
    # morre com "host not found in upstream" e não tenta de novo.
    # `service_started` (e não `service_healthy`) porque o gateway deve ficar
    # de pé mostrando erro de API enquanto a migração roda: melhor do que não
    # existir página nenhuma.
    depends_on:
      backend:
        condition: service_started
    # Só na rede própria da stack. Na telahub_net o nome `backend` ficaria
    # ambíguo se outra stack com um serviço `backend` entrasse nela.
    networks:
      - default
    healthcheck:
      # 127.0.0.1, não localhost: localhost resolve para ::1 dentro do
      # container e o nginx desta imagem só escuta em IPv4.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Rede própria da stack (o compose cria `<stack>_default`). É por ela que o
  # gateway chega ao backend.
  default:
  # Compartilhada com as stacks do site, do checkout e do túnel.
  # Criada uma única vez:  docker network create telahub_net
  telahub_net:
    external: true

volumes:
  pgdata:
  uploads_data:
