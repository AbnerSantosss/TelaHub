# Cloudflare Tunnel em container — NÃO USADO HOJE. Guardado como caminho futuro.
#
# A VPS já tem um `cloudflared` rodando no HOST, com as rotas apontando para
# `localhost:PORTA`, e é ele que serve tanto a stack antiga quanto a nova. Por
# isso a stack nova publica portas (4025/4038/4039) em vez de depender deste
# arquivo.
#
# Migrar para o modelo abaixo — cloudflared como container na rede `telahub_net`
# — permitiria remover TODAS as portas publicadas: nada da VPS ficaria acessível
# pelo IP público, só pelo túnel. Para fazer isso: criar um túnel novo, subir
# esta stack com o token, repontar os hostnames para os nomes de serviço, e só
# então apagar os blocos `ports:` dos outros composes.
#
# Diferente do túnel antigo, que roda no HOST e alcança os serviços por
# `localhost:PORTA`, este roda como container DENTRO da rede `telahub_net` e
# alcança os serviços pelo NOME. A diferença não é estética:
#
#   - a stack nova não publica porta nenhuma, então não disputa as portas
#     3025/3027/42938 com a stack antiga — as duas convivem na mesma VPS;
#   - nada da stack nova fica acessível pelo IP público da VPS, só pelo túnel.
#
# ─── Antes de subir ────────────────────────────────────────────────────────────
# 1. A rede já existe:  docker network create telahub_net
# 2. Cloudflare Zero Trust → Networks → Tunnels → Create a tunnel → Cloudflared.
#    Dê um nome próprio (ex.: `telahub-prod`) para não confundir com o antigo.
#    Copie o TOKEN.
# 3. Cole o token na variável TUNNEL_TOKEN da stack no Portainer — nunca aqui,
#    nunca no Git: quem tem o token abre uma entrada para dentro desta rede.
#
# ─── Public Hostnames a cadastrar no túnel NOVO ───────────────────────────────
#   painel.proxserverabner.site    →  HTTP  →  frontend:3025
#   vendas.proxserverabner.site    →  HTTP  →  site:80
#   checkout.proxserverabner.site  →  HTTP  →  checkout:80
#
# Os nomes acima são os dos serviços das outras stacks; todas precisam estar em
# `telahub_net` para este container enxergá-las.
#
# O BACKEND NÃO RECEBE HOSTNAME. Cada frontend já faz proxy de `/api/` para
# `backend:3001` pelo próprio Nginx — publicar a API direto só criaria mais uma
# origem para manter no CORS e mais superfície para atacar.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: telahub-tunnel-prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - telahub_net

networks:
  telahub_net:
    external: true
