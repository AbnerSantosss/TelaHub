# nginx da imagem AVULSA do painel. Em produção o painel é servido pelo
# gateway do domínio único (apps/gateway/nginx.conf); este arquivo vale para
# quem rodar esta imagem sozinha.
#
# Este arquivo vira /etc/nginx/conf.d/default.conf (ver Dockerfile), que o nginx
# inclui dentro do bloco `http`. Por isso o `map` fica aqui no topo.
#
# noindex por HOST: só os domínios que começam com `dev` ficam fora do Google.
# Quando a versão virar produção com outro nome, o header some sozinho.
# Valor vazio faz o nginx omitir o header.
map $host $telahub_robots {
    default "";
    ~^dev   "noindex, nofollow";
}

server {
    listen 3025;
    server_name localhost;
    client_max_body_size 500M;
    root /usr/share/nginx/html;

    # Redirect relativo: atrás do túnel o nginx recebe HTTP e mandaria o
    # navegador para http://.
    absolute_redirect off;

    # Herdado por todas as locations abaixo. Atenção: uma location que tiver
    # o próprio `add_header` perde este. Nesse caso, repita a linha nela.
    add_header X-Robots-Tag $telahub_robots always;

    # O build tem `base: '/app/'` (vite.config.ts). HashRouter: a rota fica
    # depois do `#`, então só /app/index.html precisa existir.
    location = /app {
        return 301 /app/$is_args$args;
    }
    location /app/ {
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Qualquer outro caminho é endereço antigo do painel (que vivia na raiz):
    # / vira /app/, mantendo a query. O `#/rota` o navegador preserva sozinho.
    location / {
        return 301 /app$request_uri;
    }

    # Proxy para a API no backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts maiores para uploads grandes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Proxy para uploads locais no backend
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
