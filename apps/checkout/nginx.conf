# nginx da imagem AVULSA do checkout (stack 119, só na transição). Em produção
# o checkout é servido pelo gateway do domínio único (apps/gateway/nginx.conf).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect relativo: atrás do túnel o nginx recebe HTTP e mandaria o
    # navegador para http://.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────────
    # Proxy da API.
    #
    # O app chama sempre caminho relativo `/api/...` (ver src/lib/api.ts), para
    # o mesmo build servir em qualquer domínio. É aqui que o caminho vira o
    # backend do TelaHub.
    #
    # `API_UPSTREAM` precisa apontar para o backend acessível a partir DESTE
    # container. Se checkout e backend estiverem em stacks diferentes no
    # Portainer, eles precisam compartilhar uma rede Docker — senão o nome do
    # serviço não resolve. Ver README.
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A cadeia de X-Forwarded-For é o que permite ao backend enxergar o IP
        # do visitante. Sem isso, o rate limit do checkout agrupa todo mundo
        # num contador só (ver TRUST_PROXY no backend).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `Origin` é preservado de propósito: o backend valida a origem por
        # igualdade em CORS_ORIGINS, e o domínio do checkout precisa estar lá.
        proxy_set_header Origin $http_origin;
    }

    # O build tem `base: '/checkout/'` (vite.config.ts).
    location = /checkout {
        return 301 /checkout/$is_args$args;
    }

    location ~* ^/checkout/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /checkout/c, /checkout/c/:token e /checkout/admin/* são resolvidas
    # no cliente.
    location /checkout/ {
        try_files $uri $uri/ /checkout/index.html;
    }

    # Endereços antigos, de quando o checkout vivia na raiz: /c/<token> (link
    # de recuperação de abandono já enviado por e-mail), /admin/... e /.
    # `$request_uri` leva a query junto.
    location / {
        return 301 /checkout$request_uri;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
