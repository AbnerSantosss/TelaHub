# Stack NOVA do site de vendas, em paralelo à antiga.
#
# TRANSIÇÃO (15/10/2026): o site passou a ser servido pelo gateway do domínio
# único (docker-compose.prod.yml da raiz, porta 4025). Esta stack só continua
# útil enquanto a rota devtelahublandingpage do túnel apontar para a 4038.
# Depois de repontar a rota para a 4025, ela pode ser parada.
#
# Arquivo separado do `docker-compose.yml`, que é o usado pela stack antiga.
# Porta própria (4038), diferente da 42938 da stack antiga: o túnel desta VPS
# roda no HOST e roteia para `localhost:PORTA`, então publicar é obrigatório, e
# repetir a porta da stack antiga impediria o container de subir.

services:
  site:
    build:
      # Contexto na RAIZ do monorepo: o site importa arquivos de packages/.
      # O caminho é relativo a este arquivo (apps/site/).
      context: ../..
      dockerfile: apps/site/Dockerfile
      args:
        # Lidos em tempo de BUILD pelo Vite. Uma variável da stack com o mesmo
        # nome passa por cima do default e entra no bundle, mas só com rebuild.
        # Absolutos de propósito: esta stack responde num host próprio, e os
        # links têm de levar ao domínio único, onde estão painel e checkout.
        - VITE_CHECKOUT_URL=${VITE_CHECKOUT_URL:-https://devtelahub.proxserverabner.site/checkout}
        - VITE_APP_URL=${VITE_APP_URL:-https://devtelahub.proxserverabner.site/app}
        - VITE_API_URL=${VITE_API_URL:-https://devtelahub.proxserverabner.site/api}
        # Preços do build (scripts/fetch-plans.mjs). Se a API não responder, o
        # build segue com o snapshot de src/data/planos.json.
        - PLANS_API_URL=${PLANS_API_URL:-https://devtelahub.proxserverabner.site/api}
    container_name: telahub-site-prod
    restart: unless-stopped
    ports:
      # devtelahublandingpage.proxserverabner.site -> localhost:4038
      # Host com "dev" no nome sai do Google pelo nginx.conf (noindex por host).
      - "4038:80"
    networks:
      - telahub_net
    healthcheck:
      # 127.0.0.1, não localhost: localhost resolve para ::1 dentro do
      # container e o nginx desta imagem só escuta em IPv4, o que marcava o
      # container como "unhealthy" mesmo respondendo 200 de verdade.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  telahub_net:
    external: true
