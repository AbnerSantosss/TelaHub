# Stack NOVA do site de vendas, em paralelo à antiga.
#
# Arquivo separado do `docker-compose.yml`, que é o usado pela stack antiga.
# Porta própria (4038), diferente da 42938 da stack antiga: o túnel desta VPS
# roda no HOST e roteia para `localhost:PORTA`, então publicar é obrigatório, e
# repetir a porta da stack antiga impediria o container de subir.

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lidos em tempo de BUILD pelo Vite. Uma variável da stack com o mesmo
        # nome passa por cima do default e entra no bundle, mas só com rebuild.
        - VITE_CHECKOUT_URL=${VITE_CHECKOUT_URL:-https://devtelahubcheckout.proxserverabner.site}
        - VITE_APP_URL=${VITE_APP_URL:-https://devtelahubpainel.proxserverabner.site}
        - VITE_API_URL=${VITE_API_URL:-https://devtelahubpainel.proxserverabner.site/api}
        # Preços do build (scripts/fetch-plans.mjs). Se a API não responder, o
        # build segue com o snapshot de src/data/planos.json.
        - PLANS_API_URL=${PLANS_API_URL:-https://devtelahubpainel.proxserverabner.site/api}
    container_name: telahub-site-prod
    restart: unless-stopped
    ports:
      # devtelahublandingpage.proxserverabner.site -> localhost:4038
      # Host com "dev" no nome sai do Google pelo nginx.conf (noindex por host).
      - "4038:80"
    networks:
      - telahub_net
    healthcheck:
      # 127.0.0.1, não localhost: localhost resolve para ::1 dentro do
      # container e o nginx desta imagem só escuta em IPv4, o que marcava o
      # container como "unhealthy" mesmo respondendo 200 de verdade.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  telahub_net:
    external: true
