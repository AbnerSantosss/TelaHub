# Noindex por host.
#
# Este arquivo vira /etc/nginx/conf.d/default.conf, que o nginx inclui dentro
# do bloco `http`. Por isso o `map` fica aqui no topo, fora do `server`.
#
# Host que começa com "dev" (devtelahublandingpage...) fica fora do Google.
# Qualquer outro host recebe valor vazio, e o nginx não manda header vazio.
# Quando a versão for publicada com um nome sem "dev", o bloqueio some sozinho,
# sem rebuild e sem mexer no robots.txt.
map $host $telahub_robots {
    default "";
    ~^dev   "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # robots.txt por host. Em host "dev" responde bloqueando tudo. Nos outros
    # serve o arquivo de public/robots.txt, que libera o site.
    # O `if` só com `return` dentro de uma location é o uso seguro dele.
    location = /robots.txt {
        default_type text/plain;
        if ($host ~* ^dev) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        try_files $uri =404;
    }

    # Cache static assets
    # ATENÇÃO: uma location com add_header próprio NÃO herda os add_header do
    # server. Por isso o X-Robots-Tag se repete aqui.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $telahub_robots always;
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Noindex dos hosts "dev" (ver o map no topo).
    add_header X-Robots-Tag $telahub_robots always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
