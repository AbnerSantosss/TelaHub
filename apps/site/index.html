<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0369a1" />

    <title>TelaHub — coloque seus avisos, ofertas e agenda na TV que você já tem</title>
    <meta name="description" content="Portaria de condomínio, recepção de empresa, sala de espera, balcão de loja: a TV que já está ligada passa a mostrar o seu aviso, sua oferta e sua agenda — trocados do celular em 30 segundos. Sem pen-drive, sem técnico e sem comprar equipamento. A primeira tela é grátis para sempre; depois, a partir de R$ 39 por tela/mês no plano anual." />
    <!-- Lei da Categoria (Ries & Trout): "digital signage" é o termo do mercado
         corporativo, dominado por integradores. Síndico, gerente de escritório e
         dono de loja buscam em português concreto — e buscam pela CENA deles, não
         pela categoria. Por isso os termos de porte/ambiente vêm primeiro e os de
         categoria corporativa depois, para não perder quem já os conhece.
         Decisão de 2026-08-30: o produto é HORIZONTAL por porte. Termo de comida
         não abre a lista (é dominado por QR/delivery) e não abre a página. -->
    <meta name="keywords" content="painel de avisos para condomínio, mural digital para portaria, tv de recepção para empresa, tela para sala de espera de clínica, tv de ofertas para loja, grade de aulas na tv da academia, avisos na tv por celular, totem vertical para vitrine, digital signage, telahub" />
    <link rel="canonical" href="https://telahub.com.br/" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / redes sociais (LinkedIn, WhatsApp — canais comuns em vendas B2B) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="TelaHub" />
    <meta property="og:title" content="Sua TV está ligada. E não está dizendo nada." />
    <meta property="og:description" content="Avisos, ofertas, agenda e informação na TV que você já tem — trocados do celular. Primeira tela grátis para sempre, sem cartão e sem técnico." />
    <meta property="og:image" content="https://telahub.com.br/capturas/real-painel.jpg" />
    <meta property="og:url" content="https://telahub.com.br/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sua TV está ligada. E não está dizendo nada." />
    <meta name="twitter:description" content="Avisos, ofertas e agenda na TV que você já tem, trocados do celular. A primeira tela é grátis para sempre." />
    <meta name="twitter:image" content="https://telahub.com.br/capturas/real-painel.jpg" />

    <!-- Dados estruturados (SEO/AEO/GEO): entidade da organização e do produto.
         Os preços aqui precisam bater com `src/data/planos.json` — que é o
         snapshot de `GET /api/plans`. Rich snippet com preço divergente do
         cobrado é o mesmo problema de CDC (arts. 30 e 37) que a página já
         corrigiu uma vez, só que exibido direto no Google. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://telahub.com.br/#organization",
          "name": "TelaHub",
          "url": "https://telahub.com.br/",
          "logo": "https://telahub.com.br/favicon.svg"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://telahub.com.br/#software",
          "name": "TelaHub",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "Sistema brasileiro para colocar avisos, ofertas, agenda e informação nas telas de um negócio — condomínio, escritório, clínica, loja, academia ou rede de unidades — usando a TV que já existe no lugar, com troca de conteúdo pelo celular e aviso por e-mail quando uma tela para de responder.",
          "publisher": { "@id": "https://telahub.com.br/#organization" },
          "offers": [
            {
              "@type": "Offer",
              "name": "Grátis",
              "price": "0",
              "priceCurrency": "BRL",
              "description": "1 tela conectada, para sempre, sem cartão de crédito."
            },
            {
              "@type": "Offer",
              "name": "Loja",
              "price": "39",
              "priceCurrency": "BRL",
              "description": "Por tela ativa/mês no plano anual (R$ 49 no mensal, sem fidelidade). Telas ilimitadas, cobrança só pelas telas ligadas.",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": "39",
                "priceCurrency": "BRL",
                "unitText": "tela ativa por mês, no plano anual"
              }
            },
            {
              "@type": "Offer",
              "name": "Rede",
              "price": "32",
              "priceCurrency": "BRL",
              "description": "Por tela ativa/mês no plano anual (R$ 39 no mensal), com piso de 5 telas na fatura. Inclui painéis de gestão e auditoria de publicação.",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": "32",
                "priceCurrency": "BRL",
                "unitText": "tela ativa por mês, no plano anual",
                "minPrice": "160"
              }
            }
          ]
        },
        {
          "@type": "WebPage",
          "@id": "https://telahub.com.br/#webpage",
          "url": "https://telahub.com.br/",
          "name": "TelaHub — coloque seus avisos, ofertas e agenda na TV que você já tem",
          "isPartOf": { "@id": "https://telahub.com.br/#organization" },
          "inLanguage": "pt-BR"
        }
      ]
    }
    </script>

    <!-- Uma família só (§3.5 do plano v2: o painel importava dez). Geist é a
         fonte do sistema visual; Inter e a do sistema operacional são a reserva
         declarada em `--fonte`, então a página não muda de layout se o Google
         Fonts estiver fora do ar — só troca o desenho da letra. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Consent Mode v2 — padrão negado ANTES de qualquer tag carregar (LGPD/GDPR) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ window.dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
    </script>

    <!-- Google Tag Manager: substitua GTM-XXXXXXX pelo ID real do container antes de publicar -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->

    <!--
      O GSAP + ScrollTrigger do cdnjs foram REMOVIDOS em 2026-07-31.

      Não por peso (~70 KB de terceiro no caminho crítico, embora isso também
      conte numa página feita para ranquear), mas porque a montagem tinha duas
      formas de deixar a página em branco: CDN fora do ar, e chegada por âncora
      (`/#precos`, o link que o painel e o checkout usam) — nesse caso o
      ScrollTrigger de tudo que ficava acima do ponto de chegada nunca
      disparava. A segunda foi reproduzida.

      A animação virou CSS + IntersectionObserver, com o estado padrão VISÍVEL:
      ver src/lib/reveal.js. Se voltar a precisar de GSAP para algo que CSS não
      faça, importe como dependência do projeto — não de CDN — e nunca deixe o
      estado inicial de um elemento de conteúdo depender dele.
    -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
