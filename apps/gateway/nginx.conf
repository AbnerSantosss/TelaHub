# Gateway do domínio único: devtelahub.proxserverabner.site
#
#   /            site (landing e páginas pré-renderizadas)
#   /app/        painel (HashRouter)
#   /checkout/   checkout (BrowserRouter com basename /checkout)
#   /api/        backend:3001
#   /uploads/    backend:3001
#   /entrar      302 para /app/#/login
#   /cadastro    302 para /app/?<query>#/signup
#
# Os três apps são compilados dentro desta imagem (ver Dockerfile) e servidos
# como arquivos estáticos. Só a api é um upstream.
#
# Este arquivo vira /etc/nginx/conf.d/default.conf, incluído no bloco `http`.
# Por isso os `map` ficam aqui no topo, fora dos `server`.

# Noindex por host. Host que começa com "dev" fica fora do Google. Valor vazio
# faz o nginx não mandar o header, então um domínio sem "dev" passa a ser
# indexado sem rebuild.
map $host $telahub_robots {
    default "";
    ~^dev   "noindex, nofollow";
}

# Cache por caminho.
# - Arquivo com hash do Vite (assets/nome-XXXXXXXX.ext direto na pasta assets
#   de cada app) nunca muda de conteúdo: cache de um ano.
# - Outros estáticos (imagens de public/, ícones, manifest) mudam sem trocar
#   de nome: um dia.
# - HTML e o resto: o navegador revalida sempre, senão um deploy novo fica
#   invisível até o cache vencer.
# Avaliado depois do try_files: o fallback da SPA cai em index.html e recebe
# no-cache.
map $uri $telahub_cache {
    # Entre aspas por causa das chaves do {8}.
    "~^/(app/|checkout/)?assets/[^/]+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$"           "public, max-age=31536000, immutable";
    ~*\.(js|css|png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|eot|mp4|webm|webmanifest)$  "public, max-age=86400";
    default                                                                    "no-cache";
}

# O painel nunca teve X-Frame-Options e o Player pode ser aberto dentro de
# outra página. Mantido assim; o site e o checkout seguem com SAMEORIGIN.
map $uri $telahub_frame {
    ~^/app/  "";
    default  "SAMEORIGIN";
}

# Prefixo do destino no redirect dos hostnames antigos.
map $host $telahub_legacy_prefix {
    default                                  "";
    devtelahubpainel.proxserverabner.site    "/app";
    devtelahubcheckout.proxserverabner.site  "/checkout";
}

# ─── Domínio único ───────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name devtelahub.proxserverabner.site localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # O túnel entrega HTTP na porta 80. Redirect com URL absoluta sairia como
    # http://... ; relativo, o navegador mantém o https da barra de endereço.
    absolute_redirect off;

    # Upload de mídia do painel.
    client_max_body_size 500M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Herdados por toda location que não tiver add_header próprio.
    add_header Cache-Control $telahub_cache;
    add_header X-Robots-Tag $telahub_robots always;
    add_header X-Frame-Options $telahub_frame always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Atalhos do funil ─────────────────────────────────────────────────────
    # Aspas obrigatórias: sem elas o nginx lê o `#` como comentário.
    location ~ ^/entrar/?$ {
        return 302 "/app/#/login";
    }
    # A query (plano, ciclo, utm_*) tem de sobreviver: vai antes do `#`, que é
    # onde o painel lê com window.location.search.
    location ~ ^/cadastro/?$ {
        return 302 "/app/$is_args$args#/signup";
    }

    # ── api ──────────────────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/telahub/proxy-backend.inc;
    }
    location /uploads/ {
        include /etc/nginx/telahub/proxy-backend.inc;
    }

    # ── Painel ───────────────────────────────────────────────────────────────
    location = /app {
        return 301 /app/$is_args$args;
    }
    # Asset que não existe responde 404, não o index.html. Senão o navegador
    # recebe HTML no lugar de JS depois de um deploy e a tela fica branca sem
    # erro que explique.
    location ^~ /app/assets/ {
        try_files $uri =404;
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # ── Checkout ─────────────────────────────────────────────────────────────
    location = /checkout {
        return 301 /checkout/$is_args$args;
    }
    location ^~ /checkout/assets/ {
        try_files $uri =404;
    }
    # /checkout/c, /checkout/c/:token e /checkout/admin/* são rotas do cliente.
    location /checkout/ {
        try_files $uri $uri/ /checkout/index.html;
    }

    # ── Site ─────────────────────────────────────────────────────────────────
    # robots.txt por host. Em host "dev" bloqueia tudo; nos outros serve o
    # arquivo de apps/site/public/robots.txt.
    location = /robots.txt {
        default_type text/plain;
        if ($host ~* ^dev) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    # `$uri/index.html` serve as páginas pré-renderizadas (/condominio etc.)
    # direto, sem o 301 para /condominio/: o canonical delas não tem a barra
    # final (src/paginas/rotas.js) e o redirect seria um salto a mais.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}

# ─── Hostnames antigos ───────────────────────────────────────────────────────
# Só funcionam depois que o dono apontar as rotas deles no túnel para a porta
# deste gateway. Enquanto apontarem para as stacks 118/119, este bloco não é
# usado.
server {
    listen 80;
    server_name devtelahublandingpage.proxserverabner.site
                devtelahubpainel.proxserverabner.site
                devtelahubcheckout.proxserverabner.site;

    absolute_redirect off;
    client_max_body_size 500M;

    # A api continua respondendo nos nomes antigos, SEM redirect: o webhook do
    # Asaas é um POST (redirect 301 vira GET ou é descartado), e bundles em
    # cache e TVs já pareadas ainda chamam /api no host antigo.
    location /api/ {
        include /etc/nginx/telahub/proxy-backend.inc;
    }
    location /uploads/ {
        include /etc/nginx/telahub/proxy-backend.inc;
    }

    # landing   /qualquer      -> /qualquer
    # painel    /?q            -> /app/?q    (o #/rota o navegador mantém)
    # checkout  /c/abc?q       -> /checkout/c/abc?q
    #           /admin/...     -> /checkout/admin/...
    location / {
        add_header X-Robots-Tag $telahub_robots always;
        return 301 https://devtelahub.proxserverabner.site$telahub_legacy_prefix$request_uri;
    }
}
